            background: #FDFCFB;
            position: relative;
            overflow: hidden;

            border-radius: 3rem;
        }

            #root {
                max-width: 100vw;
                height: 100vh;
                aspect-ratio: 9/16;
                border: none;
                border-radius: 0;
            }
        }
        
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        ::-webkit-scrollbar {
            width: 4px;

        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }

                              <button onClick={(e) => { e.stopPropagation(); setIsVerifying(false); setUserCredits(c => c + 12); }} 
                                      className="w-full py-6 bg-emerald-500 text-[#050505] rounded-[1.5rem] font-black text-sm uppercase tracking-widest shadow-2xl shadow-emerald-500/20 active:scale-95 transition-all">
                                {t.successReward} - {t.close}
                              </button>
                            </div>
                          )}
                        </div>
                      )}
                    </AnimatePresence>
                </div>
            );
        }

        function NavButton({ active, onClick, icon, label }) {
            return (
                <button onClick={onClick} className="flex flex-col items-center gap-1 group outline-none">
                    <div className={`p-3 rounded-2xl transition-all duration-300 ${active ? 'bg-emerald-50 text-emerald-600' : 'text-gray-300 group-hover:bg-gray-50'}`}>
                        <Icon name={icon} size={22} className={active ? 'fill-emerald-600/10' : ''} />
                    </div>
                    <span className={`text-[9px] font-black uppercase tracking-widest transition-colors ${active ? 'text-emerald-600' : 'text-gray-300'}`}>{label}</span>
                </button>
            );
        }

        // --- Render ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
